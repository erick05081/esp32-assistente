; Assistente pessoal ESP32 — "cérebro" no ESP32, voz pelo celular via BLE.
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = COM3
monitor_port = COM3
upload_speed = 460800

; Wi-Fi + BLE + TLS não cabem na partição padrão de 1.2 MB
board_build.partitions = huge_app.csv

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@~1.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_LOOP_STACK_SIZE=8192
